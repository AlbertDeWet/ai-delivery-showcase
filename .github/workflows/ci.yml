name: ci

on:
  push:
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          projects=$(for d in projects/*/; do [ -d "$d/tests" ] && basename "$d"; done | jq -R . | jq -sc .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Builder and adversary tests
        run: python -m pytest -q tests
      - name: Offline baseline eval (01 only; no model, no key)
        if: matrix.project == '01-nl2sql-evals'
        run: python -m nl2sql eval --provider baseline --results-dir ci-results
      - name: Demo (04 only; exit 3 = trim waiting for human sign-off, which is expected)
        if: matrix.project == '04-semantic-model-guard'
        run: |
          set +e
          python -m smguard demo
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "demo failed with exit $rc"; exit "$rc"; fi

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ARC guard hook tests
        run: python method/harness/test_arc_guard.py

  leakcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The denylist is private and untracked, so CI checks emails and attribution lines only.
      # The full denylist check runs locally in the pre-commit and commit-msg hooks.
      - name: Leak check
        run: python scripts/leakcheck.py --allow-missing-denylist
